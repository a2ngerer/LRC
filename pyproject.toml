[project]
name = "lrc-benchmark"
version = "0.1.0"
description = "Benchmark: 4 neuron types x 2 wirings on Neural ODE + control tasks"
requires-python = ">=3.11, <3.13"
dependencies = [
    "tensorflow>=2.15,<2.16",
    "numpy",
    "matplotlib",
    "scipy",
    "pyyaml",
    "tqdm",
    "pandas",
    "ncps",
    "pingouin>=0.6.1",
    "rliable>=1.2.0",
]

[project.optional-dependencies]
metal = ["tensorflow-metal"]
# GPU cluster (Linux/CUDA 12): uv sync --extra cuda
cuda = ["tensorflow[and-cuda]>=2.15,<2.16"]
# MuJoCo RL control benchmark (PPO with the thesis cells as recurrent policies).
# Local: uv sync --extra rl ; Cluster: uv sync --extra cuda --extra rl
rl = [
    "gymnasium[mujoco]>=1.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
