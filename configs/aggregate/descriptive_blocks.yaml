# Spec for `experiments/aggregate_results.py --descriptive` (#109): the
# descriptive F2 blocks (protocol F2 sections 5.1, 5.2 and the descriptive
# part of 2.3; constant DESCRIPTIVE_BLOCKS in the aggregator, which fixes
# arms, seeds, reference and reading). Per block one entry per arm label:
#   label             the arm label as arm_label returns it
#   protocol_version  the config.effective.protocol_version every record of
#                     the arm carries (a string, or a list of strings for an
#                     arm whose seeds come from F1 and F2 records)
#   paths             run folders (searched recursively, inside the folder
#                     only) or record files; no patterns; [] for an arm that
#                     did not run (its rows become 'not run')
# Only the block's seeds are read. Replace every <...> placeholder before
# use. F1 arms come from the F1 final run folders only, never from an F2
# folder; B2 lrc/ncp lists the F1 records of seeds 0-4 and the F2 records of
# seeds 5-9 (record files where a folder holds more seeds).

B1:
  - label: lrc_init/ncp
    protocol_version: F2-2026-11-05
    paths: [<F2_DUFFING_B1_RUN_DIR>]
  - label: lrc/ncp
    protocol_version: F1-2026-10-26
    paths: [<F1_DUFFING_FINAL_RUN_DIR>]
  - label: lrc_cal_duffing/ncp
    protocol_version: F2-2026-11-05
    paths: [<F2_DUFFING_B1_RUN_DIR>]
B2:
  - label: lrc_init/ncp
    protocol_version: F2-2026-11-05
    paths: [<F2_LV_B2_RUN_DIR>]
  - label: lrc/ncp
    protocol_version: [F1-2026-10-26, F2-2026-11-05]
    paths: [<F1_LV_FINAL_RUN_DIR>, <F2_LV_LRC_NCP_SEEDS_5_9_RUN_DIR>]
  - label: cfc_lrc/ncp
    protocol_version: F1-2026-10-26
    paths: [<F1_LV_FINAL_RUN_DIR>]
  - label: lrc_cal_lv/ncp
    protocol_version: F2-2026-11-05
    paths: [<F2_LV_B2_RUN_DIR>]
