# S0 smoke of the frozen suite (protocol freeze F1-2026-10-26, validation
# ladder S0; #72): the 32 arms of duffing_hpo.yaml for 3 epochs, one fit per
# arm (tuning seed 100, one lr x one clip value). The diagnostic arms ltc,
# mm_ltc and cfc_mm_ltc on ncp run as ordinary arms here (no config_from: the
# smoke has no selection to borrow).
#   BENCH=00_canary ./cluster/submit_suite.sh configs/suite/smoke_duffing.yaml s0-smoke-duffing
task: lv
system: duffing
stage: hpo
cells:
  cfc: [dense, dense3, ncp, cncp]
  cfc_lrc: [dense, dense3, ncp, cncp]
  cfc_lrc_outer: [dense, ncp]
  cfc_mm_lrc: [dense, ncp]
  lrc: [dense, dense3, ncp]
  mm_lrc: [dense, ncp]
  gru: [dense, dense3, ncp, cncp]
  lstm: [dense, dense3, ncp]
  ctrnn: [dense, dense3, ncp]
  mlp: [dense]
  cfc_static: [ncp]
  ltc: [ncp]
  mm_ltc: [ncp]
  cfc_mm_ltc: [ncp]
param_budget: 4000
seeds: [100]
epochs: 3
ode_unfolds: 6
dt_scale: auto
extra_args: [--forcing, mixed, --grid-lr, 1e-3, --grid-clip, "off"]
cluster: {runs_per_gpu: 6, walltime: "01:00:00"}
