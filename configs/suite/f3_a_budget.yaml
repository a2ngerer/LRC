# F3 block A, descriptive budget arm (protocol F3 section 5.1.2; #156): lrc/ncp,
# seeds 10-14, 200 epochs, fixed lr 0.01 without clipping, with
# the RQ4 diagnostics. 5 fits, 5 array tasks (one fit per GPU; the walltime
# is four times the 50-epoch default). Production, no condition.
#   ./cluster/submit_suite.sh --wandb <submit copy of f3_a_budget.yaml> f3-a-budget
task: pa
stage: final
cells:
  lrc: [ncp]
param_budget: 30000
seeds: [10, 11, 12, 13, 14]
epochs: 200
ode_unfolds: 6
dt_scale: auto
extra_args: [--deterministic, --diagnostics]
fixed: {lr: 0.01, clipnorm: null}
cluster: {runs_per_gpu: 1, walltime: "24:00:00"}
