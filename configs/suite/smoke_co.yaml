# S0 smoke of the consensus study (protocol freeze F1-2026-10-26, validation
# ladder S0; #72): the nine K = 3 arms of co_k3_hpo.yaml for 3 epochs, one
# fit per arm (tuning seed 100, one lr, clip off). Not part of the 93
# arm-tasks of the four rollout and Person Activity smokes.
#   BENCH=00_canary ./cluster/submit_suite.sh configs/suite/smoke_co.yaml s0-smoke-co
task: co
stage: hpo
arms:
  ncp_cons: {cell: cfc_lrc, wiring: ncp}
  ncp_lam0: {cell: cfc_lrc, wiring: ncp, vote_lambda: 0}
  ncp_med: {cell: cfc_lrc, wiring: ncp, consensus: median}
  cncp_cons: {cell: cfc_lrc, wiring: cncp}
  cncp_lam0: {cell: cfc_lrc, wiring: cncp, vote_lambda: 0}
  cncp_med: {cell: cfc_lrc, wiring: cncp, consensus: median}
  avg_in: {cell: cfc_lrc, wiring: ncp, view_average: mean}
  fault_mean: {cell: cfc_lrc, wiring: ncp, view_average: fault_mean}
  aug_mono: {cell: cfc_lrc, wiring: ncp, n_columns: 1}
param_budget: 30000
seeds: [100]
epochs: 3
extra_args: [--n-columns, 3, --backbone-layers, 1, --grid-lr, 1e-3, --grid-clip, "off"]
cluster: {runs_per_gpu: 6, walltime: "01:00:00"}
