# Suite addendum (issue #82, after the init diagnostic diag_pa_init*): grid
# HPO of the init-scaled LRC on the NCP wiring, lrc_init/ncp, with the PA
# protocol of pa_hpo.yaml (two tuning seeds, 4 lr x 2 clip, top 2, edge
# rule). Not part of the frozen pa_* counts; its own run folder.
#   ./cluster/submit_suite.sh configs/suite/addendum_pa_lrc_init_hpo.yaml pa-hpo-lrc-init
task: pa
stage: hpo
cells:
  lrc_init: [ncp]
param_budget: 30000
seeds: [100, 101]
epochs: 50
ode_unfolds: 6
dt_scale: auto
extra_args: [--deterministic]
cluster: {runs_per_gpu: 1, walltime: "12:00:00"}
heavy:
  arms: [lrc_init_ncp]
  cluster: {runs_per_gpu: 1}
