# Control (F1-2026-10-26 a; #71, descriptive): lrc/ncp on Person Activity with
# ode_unfolds 1 instead of 6, 5 seeds, no HPO: lr/clip from lrc/ncp's (k = 6)
# hpo_selection.json of the pa-hpo run. Its own run folder (same result names
# as the main arm). Not part of the frozen per-task counts.
#   ./cluster/submit_suite.sh configs/suite/control_pa_k1.yaml pa-k1
task: pa
stage: final
cells: [lrc]
wirings: [ncp]
param_budget: 30000
seeds: [0, 1, 2, 3, 4]
epochs: 50
ode_unfolds: 1
dt_scale: auto
extra_args: [--deterministic]
hpo_dir: results/03_person_activity/<pa-hpo run>/results/hpo
cluster: {runs_per_gpu: 1, walltime: "06:00:00"}
