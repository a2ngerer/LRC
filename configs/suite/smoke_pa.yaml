# S0 smoke of the frozen suite (protocol freeze F1-2026-10-26, validation
# ladder S0; #72): the 28 arms of pa_hpo.yaml for 3 epochs, one fit per arm
# (tuning seed 100, one lr x one clip value). The solver arms on ncp run two
# fits per GPU.
#   BENCH=00_canary ./cluster/submit_suite.sh configs/suite/smoke_pa.yaml s0-smoke-pa
task: pa
stage: hpo
cells:
  cfc: [dense, dense3, ncp, cncp]
  cfc_lrc: [dense, dense3, ncp, cncp]
  cfc_lrc_outer: [dense, ncp]
  cfc_mm_lrc: [dense, ncp]
  lrc: [dense, dense3, ncp]
  mm_lrc: [dense, ncp]
  gru: [dense, dense3, ncp, cncp]
  lstm: [dense, dense3, ncp]
  ctrnn: [dense, dense3, ncp]
  cfc_static: [dense]
param_budget: 30000
seeds: [100]
epochs: 3
ode_unfolds: 6
dt_scale: auto
extra_args: [--grid-lr, 1e-3, --grid-clip, "off"]
cluster: {runs_per_gpu: 6, walltime: "01:00:00"}
heavy:
  arms: [lrc_ncp, mm_lrc_ncp, ctrnn_ncp]
  cluster: {runs_per_gpu: 2}
