# Frozen final suite (F1-2026-10-26; #71): Lotka-Volterra final fits, seeds 0-4
# for the 28 arms of lv_hpo.yaml (140), seeds 5-9 for the five ten-seed arms
# (25, emitted last). Set hpo_dir to the fetched HPO run first.
#   ./cluster/submit_suite.sh configs/suite/lv_final.yaml lv-final
task: lv
stage: final
cells:
  cfc: [dense, dense3, ncp, cncp]
  cfc_lrc: [dense, dense3, ncp, cncp]
  cfc_lrc_outer: [dense, ncp]
  cfc_mm_lrc: [dense, ncp]
  lrc: [dense, dense3, ncp]
  mm_lrc: [dense, ncp]
  gru: [dense, dense3, ncp, cncp]
  lstm: [dense, dense3, ncp]
  ctrnn: [dense, dense3, ncp]
  mlp: [dense]
param_budget: 4000
seeds: [0, 1, 2, 3, 4]
extra_seeds:
  seeds: [5, 6, 7, 8, 9]
  arms: [cfc_lrc_dense3, cfc_lrc_ncp, cfc_lrc_cncp, gru_dense, gru_ncp]
epochs: 300
ode_unfolds: 6
dt_scale: auto
extra_args: [--forcing, mixed, --deterministic]
hpo_dir: results/01_lotka_volterra/<lv-hpo run>/results/hpo
cluster: {runs_per_gpu: 3, walltime: "04:00:00"}
