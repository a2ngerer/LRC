# F3 guard SW1 (protocol F3 section 3.3; #156): cfc_lrc, gru and lstm on ncp,
# periodic Lotka-Volterra, seed 0, lr and clip of the F1 selections. 3 fits, 1
# array task.
#   ./cluster/submit_suite.sh --wandb <submit copy of f3_guard_lv.yaml> f3-guard-lv
task: lv
stage: final
cells:
  cfc_lrc: [ncp]
  gru: [ncp]
  lstm: [ncp]
param_budget: 4000
seeds: [0]
epochs: 300
ode_unfolds: 6
dt_scale: auto
extra_args: [--forcing, mixed, --deterministic]
hpo_dir: <selection copies>/lv_hpo
cluster: {runs_per_gpu: 3, walltime: "04:00:00"}
