# F3 guard SW1 (protocol F3 section 3.3; #156): cfc_lrc/ncp and
# cfc_lrc_outer/ncp on Person Activity, seed 100, lr and clip of the F1
# selections. 2 fits, 1 array task.
#   ./cluster/submit_suite.sh --wandb <submit copy of f3_guard_pa_s100.yaml> f3-guard-pa-s100
task: pa
stage: final
cells:
  cfc_lrc: [ncp]
  cfc_lrc_outer: [ncp]
param_budget: 30000
seeds: [100]
epochs: 50
ode_unfolds: 6
dt_scale: auto
extra_args: [--deterministic]
hpo_dir: <selection copies>/pa_hpo
cluster: {runs_per_gpu: 2, walltime: "06:00:00"}
