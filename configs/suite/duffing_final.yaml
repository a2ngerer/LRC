# Frozen final suite (F1-2026-10-26; #71): Duffing final fits, seeds 0-4 for
# the 32 arms of duffing_hpo.yaml (160), seeds 5-9 for the eight ten-seed arms
# (40, emitted last). The diagnostic arms take lr/clip from their reference.
# Set hpo_dir to the fetched HPO run first.
#   ./cluster/submit_suite.sh configs/suite/duffing_final.yaml duffing-final
task: lv
system: duffing
stage: final
cells:
  cfc: [dense, dense3, ncp, cncp]
  cfc_lrc: [dense, dense3, ncp, cncp]
  cfc_lrc_outer: [dense, ncp]
  cfc_mm_lrc: [dense, ncp]
  lrc: [dense, dense3, ncp]
  mm_lrc: [dense, ncp]
  gru: [dense, dense3, ncp, cncp]
  lstm: [dense, dense3, ncp]
  ctrnn: [dense, dense3, ncp]
  mlp: [dense]
  cfc_static: [ncp]
  ltc: [ncp]
  mm_ltc: [ncp]
  cfc_mm_ltc: [ncp]
config_from: {ltc_ncp: lrc_ncp, mm_ltc_ncp: lrc_ncp, cfc_mm_ltc_ncp: cfc_mm_lrc_ncp}
param_budget: 4000
seeds: [0, 1, 2, 3, 4]
extra_seeds:
  seeds: [5, 6, 7, 8, 9]
  arms: [cfc_lrc_dense3, cfc_lrc_ncp, cfc_lrc_cncp, gru_ncp, gru_dense, lrc_ncp,
         cfc_ncp, cfc_static_ncp]
epochs: 300
ode_unfolds: 6
dt_scale: auto
extra_args: [--forcing, mixed]
hpo_dir: results/02_duffing/<duffing-hpo run>/results/hpo
cluster: {runs_per_gpu: 3, walltime: "04:00:00"}
