# F2 T2 HPO (protocol F2 section 4; #105): grid HPO of the new LV arms
# ncp_random (#17), lrc_init and lrc_cal_lv (LV addendum B2), one array task
# per chain. 3 x 11 = 33 planned fits. dense3_w is f2_hpo_lv_w.yaml.
#   ./cluster/submit_suite.sh configs/suite/f2_hpo_lv.yaml f2-hpo-lv
task: lv
stage: hpo
cells:
  cfc_lrc: [ncp_random]
  lrc_init: [ncp]
  lrc_cal_lv: [ncp]
param_budget: 4000
seeds: [100, 101]
epochs: 300
ode_unfolds: 6
dt_scale: auto
extra_args: [--forcing, mixed, --deterministic]
cluster: {runs_per_gpu: 1, walltime: "12:00:00"}
