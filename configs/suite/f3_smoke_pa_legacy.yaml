# F3 smoke SW1 (protocol F3 section 7; #156): lrc, lrc_cal and lrc_init on ncp under rmsprop_legacy,
# 3 epochs, seed 0, fixed lr 0.001 without clipping, two per GPU (heavy).
# 3 lines, 2 array tasks.
# Submitted twice under --deterministic into two labels and run folders
# (f3-smoke-pa-legacy-1, f3-smoke-pa-legacy-2); a third submit copy without
# --deterministic runs only if a legacy smoke aborts under it.
#   BENCH=00_canary ./cluster/submit_suite.sh --wandb <submit copy of f3_smoke_pa_legacy.yaml> f3-smoke-pa-legacy
task: pa
stage: final
cells:
  lrc: [ncp]
  lrc_cal: [ncp]
  lrc_init: [ncp]
param_budget: 30000
seeds: [0]
epochs: 3
ode_unfolds: 6
dt_scale: auto
extra_args: [--optimizer, rmsprop_legacy, --deterministic]
fixed: {lr: 0.001, clipnorm: null}
cluster: {runs_per_gpu: 2, walltime: "01:00:00"}
heavy:
  arms: [lrc_ncp, lrc_cal_ncp, lrc_init_ncp]
  cluster: {runs_per_gpu: 2}
