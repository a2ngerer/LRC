# F2 T2 HPO (protocol F2 sections 2.2, 4, A2; #105, #85): grid HPO of dense3_w
# on LV, cfc_lrc/dense3 at --size 15 without a parameter budget. 11 planned
# fits, one array task. Own run folder (its arm folder is hpo/cfc_lrc_dense3).
#   ./cluster/submit_suite.sh configs/suite/f2_hpo_lv_w.yaml f2-hpo-lv-w
task: lv
stage: hpo
cells:
  cfc_lrc: [dense3]
seeds: [100, 101]
epochs: 300
ode_unfolds: 6
dt_scale: auto
extra_args: [--forcing, mixed, --deterministic, --size, 15]
cluster: {runs_per_gpu: 1, walltime: "12:00:00"}
