# F3 diagnostics check SW1 (protocol F3 section 2.1; #156): lrc_cal/ncp on
# Person Activity, seed 0, 50 epochs, fixed lr 0.001 without clipping, with
# the RQ4 diagnostics. 1 fit, 1 array task.
# Conditional: submitted only if f3_diag_pa_cal50 deviates.
#   ./cluster/submit_suite.sh --wandb <submit copy of f3_diag_pa_cal50_d.yaml> f3-diag-pa-cal50-d
task: pa
stage: final
cells:
  lrc_cal: [ncp]
param_budget: 30000
seeds: [0]
epochs: 50
ode_unfolds: 6
dt_scale: auto
extra_args: [--deterministic, --diagnostics]
fixed: {lr: 0.001, clipnorm: null}
cluster: {runs_per_gpu: 1, walltime: "06:00:00"}
