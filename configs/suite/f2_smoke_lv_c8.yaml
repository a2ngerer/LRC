# F2 T1 smoke (protocol F2 sections 5.1 B3, 7; #105, #88): the four C8 arms
# with --lr-schedule linear, 3 epochs, seed 0. 4 lines. Own YAML: the result
# names equal those of the plain arms.
#   BENCH=00_canary ./cluster/submit_suite.sh configs/suite/f2_smoke_lv_c8.yaml f2-smoke-lv-c8
task: lv
stage: final
cells:
  lrc: [ncp, dense]
  lrc_init: [ncp]
  lrc_cal_lv: [ncp]
param_budget: 4000
seeds: [0]
epochs: 3
ode_unfolds: 6
dt_scale: auto
extra_args: [--forcing, mixed, --deterministic, --lr-schedule, linear]
fixed: {lr: 0.001, clipnorm: null}
cluster: {runs_per_gpu: 8, walltime: "01:00:00"}
