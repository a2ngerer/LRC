# Campaign v3 -- forward-rollout stability of the stiff ODE cells.
# Equivalent to build_specs_v3() (run_benchmark.py:270).
# CONCAT mode: three blocks concatenated in SLURM-array order, each a full
# cell x wiring x system x seed cross-product with its OWN cells / systems /
# seeds / constants. Blocks inherit the campaign-level wirings + clip_norm.
#   [0,480)   robustness      -- 4 ODE cells x 2 x 6 systems x seeds 5-14  = 480
#   [480,600) solver-fidelity -- 2 stiff cells x 2 x 2 systems x seeds 0-14,
#                                + constant ode_unfolds=24                 = 120
#   [600,720) training-horizon -- same matrix, + constant batch_time=64    = 120
#   total = 720 -> results/runs_v3.
name: v3
mode: concat
outdir: results/runs_v3

# Cluster resources for submit_campaign.sh (env override > this > config.sh).
# Stiff-ODE cells -> 6 runs/GPU @ 64G, 8h (mirrors retired submit_benchmark_v3.sh).
cluster:
  partition: GPU-a40
  gpu: a40:1
  cpus: 12
  mem: 64G
  walltime: "08:00:00"
  runs_per_gpu: 6
  requeue: true
description: >
  Forward-rollout-stability probe on the stiff ODE cells. A robustness block
  extends the v1/v2 seeds (0-4) to 15 total on all ODE cells, then two
  intervention blocks dial one forward-stability lever each (finer integration
  via ode_unfolds, longer horizon via batch_time) on the divergent ltc-family
  over the two trigger systems at the full 15-seed sweep.

# Campaign-level defaults inherited by every block unless the block overrides.
wirings: [dense, ncp]
systems:
  - spiral
  - duffing
  - periodic_sinusoidal
  - periodic_predator_prey
  - limited_predator_prey
  - nonlinear_predator_prey
clip_norm: 0.0

blocks:
  # Robustness: all four ODE cells on every system, 10 NEW seeds (5-14) that
  # extend the v1/v2 0-4 runs to 15 total. Inherits systems + wirings + clip.
  - cells: [ltc, mm_ltc, lrc, mm_lrc]
    seeds: {range: [5, 15]}        # SEEDS_V3_EXTRA = range(5, 15)

  # Solver-fidelity arm: the stiff divergers on the two trigger systems, full
  # 15-seed sweep, finer ODE integration (ode_unfolds=24 vs LTC default 6).
  - cells: [ltc, mm_ltc]           # CELLS_V3_STIFF
    systems: [duffing, periodic_predator_prey]   # SYSTEMS_V3_STIFF
    seeds: {range: [0, 15]}        # SEEDS_V3_FULL = range(0, 15)
    constants: {ode_unfolds: 24}   # V3_ODE_UNFOLDS, appended after clip_norm

  # Training-horizon arm: identical matrix, longer training horizon instead
  # (batch_time=64 vs default 16).
  - cells: [ltc, mm_ltc]
    systems: [duffing, periodic_predator_prey]
    seeds: {range: [0, 15]}
    constants: {batch_time: 64}    # V3_BATCH_TIME, appended after clip_norm

# Analysis spec consumed by experiments/analyze_campaign.py (ignored by the runner).
analysis:
  metric: nrmse
  tests: [wilcoxon, cohen_d]
  plots: [loss, phase, gradflow]
