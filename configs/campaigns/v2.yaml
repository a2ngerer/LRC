# Campaign v2 -- vanishing-gradient-fixed cells x {no clip, clip}.
# Equivalent to build_specs_v2() (run_benchmark.py:255).
# CONCAT mode: three blocks, each a full cell x wiring x system x seed product.
# The clip threshold is the per-block lever (a DIFFERENT clip_norm per block, the
# axes/explicit modes cannot vary it), and block 3 narrows the cell subset.
#   [0,180)   CELLS_V2, clip off          -- 3 x 2 x 6 x 5 = 180
#   [180,360) CELLS_V2, clip 1.0          -- 3 x 2 x 6 x 5 = 180
#   [360,480) ltc/lrc,  clip 1.0          -- 2 x 2 x 6 x 5 = 120 (isolates the fix)
#   total = 480 -> results/runs_v2.
name: v2
mode: concat
outdir: results/runs_v2

# Cluster resources for submit_campaign.sh (env override > this > config.sh).
cluster:
  partition: GPU-a40
  gpu: a40:1
  cpus: 12
  mem: 32G
  walltime: "04:00:00"
  runs_per_gpu: 12
  requeue: true
description: >
  The three vanishing-gradient-fixed cells (mm_ltc, mm_lrc, cfc) under no clip
  and under clip 1.0, plus the original ltc/lrc problem cells under clip 1.0.
  Comparing the clip-off and clip-on fixed-cell blocks isolates the optimizer
  fix from the architecture fix.

# Campaign-level defaults; blocks 1-2 inherit these cells, block 3 overrides.
cells: [mm_ltc, mm_lrc, cfc]      # CELLS_V2
wirings: [dense, ncp]
systems:
  - spiral
  - duffing
  - periodic_sinusoidal
  - periodic_predator_prey
  - limited_predator_prey
  - nonlinear_predator_prey
seeds: [0, 1, 2, 3, 4]
clip_norm: 0.0

blocks:
  # Fixed cells, gradient clipping OFF (the architecture-fix-only arm).
  - clip_norm: 0.0
  # Fixed cells, gradient clipping ON at V2_CLIP_NORM=1.0.
  - clip_norm: 1.0
  # Original problem cells under clip 1.0 -- isolates the pure optimizer fix.
  - cells: [ltc, lrc]
    clip_norm: 1.0

# Analysis spec consumed by experiments/analyze_campaign.py (ignored by the runner).
analysis:
  metric: nrmse
  tests: [wilcoxon, cohen_d]
  plots: [loss, phase, gradflow]
